# zizmor configuration.
#
# The `self-repository` audit wants the new `$/...` syntax (GitHub, July 2026).
# actionlint (as of v1.7.x) doesn't parse `$/` yet, so we keep the
# workspace-relative `./` form and ignore the audit for ci.yml until actionlint
# catches up.
rules:
  self-repository:
    ignore:
      - ci.yml
