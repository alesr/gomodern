name: gomodern
description: Analyze and modernize Go codebases using the official modernize diagnostic suite.
author: gomodern

branding:
  icon: zap
  color: blue

inputs:
  mode:
    description: "Operational mode: 'check' (fail on findings) or 'fix' (apply rewrites)."
    required: false
    default: check
  packages:
    description: Target package import path pattern.
    required: false
    default: ./...
  flags:
    description: "Additional CLI flags passed to modernize (space-separated, e.g. -any=true)."
    required: false
    default: ""
  go-version:
    description: "Optional explicit target Go version for gating rewrites (defaults to reading go.mod)."
    required: false
    default: ""
  create-pr:
    description: "In 'fix' mode, create a Git commit and Pull Request."
    required: false
    default: "false"
  pr-title:
    description: Title for automated PRs.
    required: false
    default: "refactor(go): modernize codebase syntax"
  pr-branch:
    description: Target branch name for automated PRs.
    required: false
    default: gomodern/auto-fix
  commit-message:
    description: Git commit message for applied fixes.
    required: false
    default: "refactor: apply gomodern AST rewrites"
  github-token:
    description: GitHub Token used for PR creation (defaults to the workflow token).
    required: false
    default: ""

outputs:
  has-changes:
    description: "'true' if un-modernized code was found or fixed."
    value: ${{ steps.analyze.outputs.has-changes }}
  modified-files:
    description: Space-separated list of files modified during fix mode.
    value: ${{ steps.analyze.outputs.modified-files }}
  pr-number:
    description: "The pull request ID created (if create-pr: true), otherwise empty."
    value: ${{ steps.pr.outputs.pull-request-number }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    # The Go toolchain here only needs to build the modernize binary. It is
    # pinned independently of the target's go.mod, whose version is used solely
    # for gating rewrites in the Analyze step below.
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.26.x

    - name: Install modernize
      shell: bash
      run: go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.50.0

    - name: Validate mode
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        case "${INPUT_MODE}" in
          check|fix) ;;
          *) echo "::error::invalid mode '${INPUT_MODE}' (expected 'check' or 'fix')"; exit 1 ;;
        esac

    - name: Analyze
      id: analyze
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_GO_VERSION: ${{ inputs.go-version }}
      run: |
        set -euo pipefail

        mode="${INPUT_MODE:-check}"
        packages="${INPUT_PACKAGES:-./...}"
        flags="${INPUT_FLAGS:-}"
        explicit="${INPUT_GO_VERSION:-}"

        # --- Resolve target Go version (explicit input overrides go.mod) ---
        if [ -n "${explicit}" ]; then
          go_ver="${explicit}"
        elif [ -f go.mod ]; then
          go_ver="$(awk '/^[[:space:]]*go[[:space:]]+[0-9]/{print $2; exit}' go.mod)"
        else
          echo "::error::go.mod not found; provide a go-version input" >&2
          exit 1
        fi
        [ -n "${go_ver}" ] || { echo "::error::could not determine Go version" >&2; exit 1; }

        # Normalize a semver-ish string to a sortable integer key (e.g. 1.21 -> 12100).
        ver_key() {
          printf '%s' "$1" | awk -F'[.v]' '{printf "%d%02d%02d\n", $1, $2+0, $3+0}'
        }

        target="$(ver_key "${go_ver}")"

        # --- Suppress analyzers that require a newer Go than the target ---
        # Each entry is "<analyzer-flag>:<minimum Go version>".
        version_gates="
        any:1.18
        atomictypes:1.19
        stringscut:1.18
        stringscutprefix:1.20
        minmax:1.21
        slicesclip:1.21
        slicescontains:1.21
        slicesdelete:1.21
        slicessort:1.21
        appendclipped:1.21
        rangeint:1.22
        forvar:1.22
        reflecttypefor:1.22
        mapsloop:1.23
        slicesbackward:1.23
        stditerators:1.23
        omitzero:1.24
        bloop:1.24
        stringsseq:1.24
        testingcontext:1.24
        waitgroupgo:1.25
        reflecttypeassert:1.25
        errorsastype:1.26
        newexpr:1.26
        embedlit:1.27
        "

        suppress=""
        for gate in ${version_gates}; do
          name="${gate%%:*}"
          min="${gate##*:}"
          if [ "${target}" -lt "$(ver_key "${min}")" ]; then
            suppress="${suppress} -${name}=false"
          fi
        done

        echo "::group::gomodern (${mode})"
        echo "target Go version: ${go_ver}"
        [ -z "${suppress}" ] || echo "suppressed analyzers:${suppress}"
        echo "::endgroup::"

        command -v modernize >/dev/null 2>&1 || {
          echo "::error::modernize binary not found on PATH" >&2
          exit 1
        }

        has_changes="false"
        modified=""

        if [ "${mode}" = "fix" ]; then
          set +e
          # shellcheck disable=SC2086
          modernize ${flags} ${suppress} -fix ${packages}
          rc=$?
          set -e
          # 0 = clean, 3 = findings remain (unfixable); anything else is a real error.
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 3 ]; then
            echo "::error::modernize -fix exited with status ${rc}" >&2
            exit 1
          fi
          modified="$(git status --porcelain --untracked-files=no | awk '{print $2}' | tr '\n' ' ' | sed 's/ *$//')"
          if [ -n "${modified}" ]; then
            has_changes="true"
          fi
          echo "modified-files=${modified}"
          echo "has-changes=${has_changes}"
        else
          if modernize ${flags} ${suppress} ${packages}; then
            echo "has-changes=false"
          else
            echo "::error::Un-modernized code found. See diagnostics above."
            has_changes="true"
            # Produce a unified diff of the would-be changes without leaving the
            # working tree modified: apply -fix to a clean copy and diff.
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "${tmpdir}"' EXIT
            git archive HEAD 2>/dev/null | tar -x -C "${tmpdir}" 2>/dev/null || true
            # shellcheck disable=SC2086
            (cd "${tmpdir}" && modernize ${flags} ${suppress} -fix ${packages} >/dev/null 2>&1) || true
            echo "::group::Proposed changes (diff)"
            diff -ruN --exclude=.git . "${tmpdir}" || true
            echo "::endgroup::"
            {
              echo "has-changes=${has_changes}"
              echo "modified-files="
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
        fi

        {
          echo "has-changes=${has_changes}"
          echo "modified-files=${modified}"
        } >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      id: pr
      if: ${{ inputs.mode == 'fix' && inputs.create-pr == 'true' && steps.analyze.outputs.has-changes == 'true' }}
      uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
      with:
        token: ${{ inputs.github-token || github.token }}
        title: ${{ inputs.pr-title }}
        commit-message: ${{ inputs.commit-message }}
        branch: ${{ inputs.pr-branch }}
        delete-branch: true
        body: |
          Applied `gomodern` AST rewrites to modernize Go syntax.

          **Modernized files**: ${{ steps.analyze.outputs.modified-files }}
