name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run gomodern (check mode)
        uses: ./
        with:
          mode: check
          packages: ./...

  fix:
    name: fix mode (idempotent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run gomodern (fix mode)
        id: fix
        uses: ./
        with:
          mode: fix
          packages: ./...
      - name: Assert clean tree
        env:
          HAS_CHANGES: ${{ steps.fix.outputs.has-changes }}
        run: |
          if [ "$HAS_CHANGES" != "false" ]; then
            echo "::error::fix mode reported changes on a clean tree"
            exit 1
          fi
